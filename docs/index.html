<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知策·客户沉淀</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>SALES MEMORY WORKSPACE</small><h1>知策 · 客户沉淀</h1><p>一个客户一条记录，持续积累上下文、回复和复盘。</p></div><button id="consolidateAll">半月沉淀</button></header><section class="grid"><aside class="card"><div class="row"><h2>客户</h2><button id="newClient">＋新客户</button></div><input id="search" placeholder="搜索客户"><div id="clients"></div></aside><section class="card workspace"><div id="empty">请选择或新建客户</div><div id="chat" hidden><div class="client-head"><div><h2 id="clientName"></h2><p id="clientCompany"></p></div><div><button id="export">导出 Obsidian</button><button id="consolidate">沉淀当前客户</button></div></div><div id="insight" class="insight"></div><div id="messages" class="messages"></div><div class="composer"><textarea id="input" maxlength="5000" placeholder="输入客户原话或沟通记录"></textarea><div class="row"><span id="status">Enter 发送，Shift+Enter 换行</span><button id="send">生成回复</button></div></div></div></section></section></main><dialog id="clientDialog"><form method="dialog" id="clientForm"><h2>新建客户</h2><input id="name" required placeholder="客户名称"><input id="company" placeholder="公司名称"><input id="tags" placeholder="标签，用逗号分隔"><div class="row"><button value="cancel">取消</button><button id="saveClient" value="default">创建</button></div></form></dialog><script src="app.js"></script></body></html>
